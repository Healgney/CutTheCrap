# Arm D / D+: identical to arm_a/config_arm_a.yaml except prop_dir.
prop_dir: /home/ubuntu/l2s_cache/arm_d_props
train_dataset: {
  label_path: arm_a/labels/train.json,
  video_path: /home/ubuntu/l2s_cache/features/clip,
  audio_path: /home/ubuntu/l2s_cache/features/pann,
  text_path: /home/ubuntu/l2s_cache/features/text,
}
sel_dataset: {
  label_path: arm_a/labels/sel.json,
  video_path: /home/ubuntu/l2s_cache/features/clip,
  audio_path: /home/ubuntu/l2s_cache/features/pann,
  text_path: /home/ubuntu/l2s_cache/features/text,
}
model: {
  vis_dim: 512,
  aud_dim: 2048,
  text_dim: 384,
  d_model: 512,
  self_num_layers: 3,
  text_num_layers: 3,
  cross_num_layers: 3,
  num_heads: 8,
}
train: {
  seed: 1234,
  lr: 0.0001,
  epochs: 50,
  weight_decay: 0.0001,
  warmup_epochs: 5,
  batch_size: 4,
  num_workers: 4,
}
test_cfg: {
  pre_nms_topk: 1000,
  max_seg_per_min: 0.3,
  nms_sigma: 0.5,
  min_score: 0.01,
}
